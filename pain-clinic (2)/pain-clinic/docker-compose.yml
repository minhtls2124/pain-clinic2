services:
  postgres:
    image: postgres:16-alpine
    container_name: painclinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: painclinic
      POSTGRES_PASSWORD: painclinic
      POSTGRES_DB: painclinic
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painclinic -d painclinic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
